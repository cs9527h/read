name: build-android

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 生成 Android 平台壳（首次）
        run: |
          set -e
          if [ ! -d android ]; then
            flutter create --org app.readen --project-name read --platforms=android /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
            cp /tmp/scaffold/.metadata ./.metadata || true
          fi
          ls -d android

      - name: 注入原生阅读设备控制
        run: |
          set -e
          mkdir -p android/app/src/main/kotlin/app/readen/read
          cp tools/android/native/MainActivity.kt android/app/src/main/kotlin/app/readen/read/MainActivity.kt
          test -s android/app/src/main/kotlin/app/readen/read/MainActivity.kt

      - name: 应用原版桌面图标
        run: bash tools/android/apply_icons.sh classic

      - name: 配置固定预览签名
        run: python3 tools/android/setup_signing.py

      - name: 统一安卓适配（低版本兼容/ABI/明文同步/lint 规避）
        run: python3 tools/android/patch_android.py

      - name: 拉取依赖
        run: flutter pub get

      - name: 生成 drift 数据库代码
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 静态检查
        run: flutter analyze --no-fatal-infos

      - name: 单元测试
        run: flutter test

      - name: 构建手机版 APK（内含原版/墨水屏双 UI，设置页可切换）
        run: flutter build apk --release --dart-define=EINK=false

      - name: 校验 APK 低版本兼容断言
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          # 用 aapt 读取 manifest，显式核对 minSdk 与 ABI，作为低版本适配证据
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort | tail -1)
          echo "=== 构建产物 ==="
          ls -lh "$APK"
          echo "=== APK 内 ABI ==="
          unzip -l "$APK" | grep -oE 'lib/(armeabi-v7a|arm64-v8a)' | sort -u || true
          echo "=== manifest minSdk（badging 摘要）==="
          AAPT_BADGING="${AAPT%2}aapt" 2>/dev/null || true
          if [ -x "$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort | tail -1)" ]; then
            AAPT_BADGING=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort | tail -1)
            "$AAPT_BADGING" dump badging "$APK" | grep -E "sdkVersion|native-code|application-label" | head -10
          fi
          test -s "$APK"

      - name: 收集手机版 APK
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/read-android.apk
          ls -lh out

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: read-apk
          path: out/*.apk
          if-no-files-found: error
