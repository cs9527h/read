name: build-android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 生成 Android 平台壳（首次）
        run: |
          set -e
          if [ ! -d android ]; then
            flutter create --org app.readen --project-name read --platforms=android /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
            cp /tmp/scaffold/.metadata ./.metadata || true
          fi
          ls -d android

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze --no-fatal-infos || true

      - name: 单元测试
        run: flutter test

      - name: 构建普通版 APK
        run: flutter build apk --release --dart-define=EINK=false

      - name: 收集普通版 APK
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/read-android.apk
          ls -lh out

      - name: 构建墨水屏 APK
        run: flutter build apk --release --dart-define=EINK=true

      - name: 收集墨水屏 APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk out/read-eink.apk
          ls -lh out

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: read-apks
          path: out/*.apk
          if-no-files-found: error
