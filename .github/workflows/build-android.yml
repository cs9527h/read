name: build-android

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 验证发布来源门禁的拒绝用例
        run: python3 -m unittest discover -s tools/android -p 'test_release_gate.py' -v

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          # 固定 Flutter 版本，避免上游 stable 漂移导致构建不可复现。
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: 生成 Android 平台壳（首次）
        run: |
          set -e
          if [ ! -d android ]; then
            flutter create --org app.readen --project-name read --platforms=android /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
            cp /tmp/scaffold/.metadata ./.metadata || true
          fi
          ls -d android

      - name: 注入原生阅读设备控制
        run: |
          set -e
          mkdir -p android/app/src/main/kotlin/app/readen/read
          cp tools/android/native/MainActivity.kt android/app/src/main/kotlin/app/readen/read/MainActivity.kt
          test -s android/app/src/main/kotlin/app/readen/read/MainActivity.kt

      - name: 应用原版桌面图标
        run: bash tools/android/apply_icons.sh classic

      - name: 配置固定预览签名
        run: python3 tools/android/setup_signing.py

      - name: 统一安卓适配（低版本兼容/ABI/明文同步/lint 规避）
        run: python3 tools/android/patch_android.py

      - name: 拉取依赖
        run: flutter pub get

      - name: 生成 drift 数据库代码
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 静态检查
        run: flutter analyze --no-fatal-infos

      - name: 单元测试
        run: flutter test

      - name: 构建手机版 APK（内含原版/墨水屏双 UI，设置页可切换）
        run: flutter build apk --release --dart-define=EINK=false --dart-define=READ_SOURCE_SHA=${{ github.sha }}

      - name: 校验 APK（包名/minSdk/ABI/versionCode/签名，失败即中止）
        run: bash tools/android/verify_apk.sh build/app/outputs/flutter-apk/app-release.apk

      - name: 收集手机版 APK
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/read-android.apk
          ls -lh out

      - name: 生成可追溯构建信息
        run: |
          python3 - <<'PY'
          import json, os, pathlib, hashlib, re
          apk=pathlib.Path("out/read-android.apk")
          version=re.search(r"(?m)^version:\s*(\S+)",pathlib.Path("pubspec.yaml").read_text()).group(1)
          pathlib.Path("out/READ_BUILD_PROVENANCE.json").write_text(json.dumps({
              "source_commit": os.environ["GITHUB_SHA"],"version":version,
              "apk_sha256":hashlib.sha256(apk.read_bytes()).hexdigest(),
              "workflow_run":os.environ["GITHUB_RUN_ID"],
              "build_type":"test-artifact-not-a-release"
          },indent=2)+"\n")
          PY
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: read-apk
          path: |
            out/*.apk
            out/READ_BUILD_PROVENANCE.json
          if-no-files-found: error
