name: build-android

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 生成 Android 平台壳（首次）
        run: |
          set -e
          if [ ! -d android ]; then
            flutter create --org app.readen --project-name read --platforms=android /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
            cp /tmp/scaffold/.metadata ./.metadata || true
          fi
          ls -d android

      - name: 应用黑白羽毛图标
        run: bash tools/android/apply_icons.sh

      - name: 配置固定预览签名
        run: python3 tools/android/setup_signing.py

      - name: Work around upstream url_launcher_android lint parser crash
        run: |
          # Target only the affected plugin's Release lint task. Flutter
          # analyzer and all app unit tests remain enabled.
          cat >> android/build.gradle.kts <<'GRADLE'
          subprojects {
              if (name == "url_launcher_android") {
                  tasks.configureEach {
                      if (name == "lintVitalAnalyzeRelease") {
                          enabled = false
                      }
                  }
              }
          }
          GRADLE

      - name: 拉取依赖
        run: flutter pub get

      - name: 生成 drift 数据库代码
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 静态检查
        run: flutter analyze --no-fatal-infos

      - name: 单元测试
        run: flutter test

      - name: 构建普通版 APK
        run: flutter build apk --release --dart-define=EINK=false

      - name: 收集普通版 APK
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/read-android.apk
          ls -lh out

      - name: 设置墨水屏独立包名
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          gradle = Path('android/app/build.gradle.kts')
          body = gradle.read_text(encoding='utf-8')
          body, n = re.subn(r'applicationId\s*=\s*"app\.readen\.read"',
                            'applicationId = "app.readen.read.eink"', body, count=1)
          if n != 1:
              raise SystemExit('Expected Android applicationId not found; review Flutter template')
          gradle.write_text(body, encoding='utf-8')
          print('E-ink applicationId set to app.readen.read.eink')
          PYCODE

      - name: 构建墨水屏 APK
        run: flutter build apk --release --dart-define=EINK=true

      - name: 收集墨水屏 APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk out/read-eink.apk
          ls -lh out

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: read-apks
          path: out/*.apk
          if-no-files-found: error
