name: build-windows-experimental

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable desktop target and create platform scaffold
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --org app.readen --project-name read --platforms=windows .
          # Flutter scaffolding can create an unrelated sample test referring to
          # MyApp/material_ui, while Read's actual app uses a different entry.
          # Remove only that exact generated template, never project tests.
          $template = "test/widget_test.dart"
          if (Test-Path $template) {
            $source = Get-Content $template -Raw
            if ($source.Contains("MyApp") -and $source.Contains("material_ui")) {
              Remove-Item $template
              Write-Output "Removed generated scaffold widget test"
            }
          }

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate drift database schema
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: flutter test

      - name: Build Windows portable application
        run: flutter build windows --release

      - name: Zip executable and DLL assets
        shell: pwsh
        run: |
          $dir = "build/windows/x64/runner/Release"
          if (!(Test-Path $dir)) { throw "Windows release directory missing" }
          Compress-Archive -Path "$dir/*" -DestinationPath "read-windows-portable.zip" -CompressionLevel Optimal

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: read-windows-portable
          path: read-windows-portable.zip
          if-no-files-found: error
