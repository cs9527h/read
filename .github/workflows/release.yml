name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布到 Release 的标签（例如 v0.2.0-preview）'
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          # 固定 Flutter 版本，避免上游 stable 漂移导致构建不可复现。
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: 生成 Android 平台壳（首次）
        run: |
          set -e
          if [ ! -d android ]; then
            flutter create --org app.readen --project-name read --platforms=android /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
            cp /tmp/scaffold/.metadata ./.metadata || true
          fi

      - name: 注入原生阅读设备控制
        run: |
          set -e
          mkdir -p android/app/src/main/kotlin/app/readen/read
          cp tools/android/native/MainActivity.kt android/app/src/main/kotlin/app/readen/read/MainActivity.kt
          test -s android/app/src/main/kotlin/app/readen/read/MainActivity.kt

      - name: 应用原版桌面图标
        run: bash tools/android/apply_icons.sh classic

      - name: 配置固定预览签名
        run: python3 tools/android/setup_signing.py

      - name: 统一安卓适配（低版本兼容/ABI/明文同步/lint 规避）
        run: python3 tools/android/patch_android.py

      - name: 拉取依赖
        run: flutter pub get

      - name: 生成 drift 数据库代码
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 静态检查
        run: flutter analyze --no-fatal-infos

      - name: 单元测试
        run: flutter test

      - name: 构建手机版 APK（内含原版/墨水屏双 UI，设置页可切换）
        run: flutter build apk --release --dart-define=EINK=false

      - name: 校验 APK（包名/minSdk/ABI/versionCode/签名，失败即中止）
        run: bash tools/android/verify_apk.sh build/app/outputs/flutter-apk/app-release.apk

      - name: 收集手机版 APK
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/read-android.apk
          ls -lh out

      - name: 生成校验值
        run: |
          cd out
          sha256sum read-android.apk | tee APK_SHA256.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: read-release-apk
          path: out/*
          if-no-files-found: error

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: Read ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          prerelease: true
          generate_release_notes: true
          body: |
            Read 极简阅读器 · 预览版（单一手机版）

            - `read-android.apk`：手机版（包名 app.readen.read，覆盖安装兼容旧版）
            - 墨水屏已内置：设置 → 界面版本 → 原版 / 墨水屏，无需单独安装第二个 APK
            - 低版本适配：minSdk 24（Android 7.0，Flutter 3.50 官方下限）；含 32/64 位 ABI；
              WebDAV http 明文同步已放行（Android 9+）；补齐 INTERNET / 通知权限
            - `APK_SHA256.txt`：校验值

            当前使用 CI 内部测试签名，**不是正式发布签名**；后续覆盖升级需要换成正式 keystore。
            功能状态以仓库 README / docs 台账为准，未在真机验证的项不会标注为已完成。
          files: |
            out/read-android.apk
            out/APK_SHA256.txt
