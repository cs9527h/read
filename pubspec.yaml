name: read
description: 极简全平台电子书阅读器（阅读功能完整 + 多端同步）
publish_to: 'none'
version: 2.3.0+17

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^10.3.10
  archive: ^4.0.7
  xml: ^6.5.0
  html: ^0.15.6
  markdown: ^7.3.0
  pdfrx: ^2.6.5
  cryptography: ^2.7.0
  crypto: ^3.0.6
  drift: ^2.35.4
  sqlite3: ^3.0.0
  path: ^1.9.1
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  charset_converter: ^2.1.1
  flutter_secure_storage: ^10.3.4
  connectivity_plus: ^7.3.1
  flutter_tts: ^4.2.5
  url_launcher: ^6.3.3
  webview_flutter: ^4.13.0
  image: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
